name: Forward Tracker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lightgbm pandas numpy pyarrow requests scikit-learn

      - name: Generate signals
        run: python .github/scripts/generate_signals.py

      - name: Commit signals
        run: |
          git config user.name "darwin-bot"
          git config user.email "bot@darwin.lab"
          git add forward_log.md assets/data/
          git diff --cached --quiet || git commit -m "signals: $(date -u '+%Y-%m-%d %H:%M')"
          git push
