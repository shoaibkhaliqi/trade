# Daily-driver profile: fast iteration, small samples, verbose checks.
mode: development
seed: 42

data:
  symbol: XAUUSDT
  timeframes: ["1m", "5m", "15m", "1h"]
  source: bybit          # exchange whose public REST API we download from
  category: linear         # XAUUSDT is a USDT-perpetual (tokenized gold), not spot
  raw_dir: data/raw
  processed_dir: data/processed
  features_dir: data/features
  # How much history per timeframe. null => everything the exchange has.
  # NOTE: XAUUSDT perp listed on Bybit 2026-03-09 - that IS all available history.
  days_back:
    "1m": null
    "5m": null
    "15m": null
    "1h": null

download:
  sleep_s: 0.15          # polite rate limiting between API pages
  page_limit: 1000       # Bybit max klines per request

simulator:
  initial_capital: 1000.0
  taker_fee_pct: 0.055   # percent per side; Bybit futures taker fee as reference
  slippage_pct: 0.02     # percent per side; conservative assumption
  fixed_position_size_pct: 25.0

risk:
  max_position_size_pct: 50.0
  max_leverage: 1.0
  max_daily_loss_pct: 5.0

experiment:
  sqlite_path: experiments/metadata.sqlite
