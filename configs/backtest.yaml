# Full backtest profile: complete historical periods, stricter accounting.
mode: backtest
seed: 42

data:
  symbol: SOLUSDT
  timeframes: ["1m", "5m", "15m", "1h"]
  raw_dir: data/raw
  processed_dir: data/processed
  features_dir: data/features

splits:
  train: null            # set at M7, e.g. ["2021-01-01", "2024-12-31"]
  validation: null       # e.g. ["2025-01-01", "2025-12-31"]
  test: null             # e.g. ["2026-01-01", null]; NEVER used for training

simulator:
  initial_capital: 1000.0
  taker_fee_pct: 0.055
  slippage_pct: 0.02
  fixed_position_size_pct: 25.0

risk:
  max_position_size_pct: 50.0
  max_leverage: 1.0
  max_daily_loss_pct: 5.0

experiment:
  sqlite_path: experiments/metadata.sqlite
